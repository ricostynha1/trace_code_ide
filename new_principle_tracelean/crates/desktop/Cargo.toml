[package]
name = "tracelean-desktop"
version = "0.1.0"
edition = "2021"
description = "TraceLean's desktop window: it renders the same buffers the terminal does."

[[bin]]
name = "tracelean-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tracelean-core = { path = "../core" }
tracelean-editor = { path = "../editor" }
