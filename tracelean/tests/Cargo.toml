[package]
name = "tracelean-tests"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "lib.rs"  # empty lib, tests-only crate

[[test]]
name = "unit"
path = "unit.rs"

[dev-dependencies]
tracelean_lib = { path = "../gui_backend", package = "tracelean" }
tracelean-core = { path = "../core" }
tempfile = "3"
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"
