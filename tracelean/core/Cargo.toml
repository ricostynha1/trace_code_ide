[package]
name = "tracelean-core"
version = "0.1.0"
description = "TraceLean core engine — shared between GUI and TUI"
authors = ["TraceLean"]
edition = "2021"

[lib]
name = "tracelean_core"
path = "src/lib.rs"

[[bin]]
name = "tracelean-agent"
path = "src/bin/tracelean-agent.rs"

[[bin]]
name = "tracelean-bench"
path = "src/bin/tracelean-bench.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"], default-features = false }
async-trait = "0.1"
bincode = "1"
thiserror = "1"
petgraph = "0.6"
rayon = "1"
regex = "1"
fastembed = "5"
agent-client-protocol = "1.2"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-cpp = "0.23"
tree-sitter-lean4 = "0.3"
tree-sitter-md = { version = "0.5", package = "tree-sitter-md-025" }
tree-sitter-javascript = "0.23"
tree-sitter-html = "0.23"
tree-sitter-css = "0.23"
tree-sitter-json = "0.23"

[dev-dependencies]
tempfile = "3"
proptest = "1"
