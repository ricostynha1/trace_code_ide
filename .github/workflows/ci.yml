name: CI

# Only the first TraceLean (`tracelean/`) is built here, so only changes to it
# on main, or a pull request touching it, run this.
on:
  push:
    branches: [main]
    paths: ["tracelean/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["tracelean/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build test image (green = every check below passed)
        run: docker build -f Dockerfile.ci -t tracelean-ci .
        working-directory: tracelean
